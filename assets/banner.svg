<svg xmlns="http://www.w3.org/2000/svg" width="880" height="190" viewBox="0 0 880 190" role="img" aria-label="Geodesic — entitlement feasibility engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#122a44"/>
      <stop offset="1" stop-color="#16324f"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8c5a"/>
      <stop offset="1" stop-color="#7fd1a8"/>
    </linearGradient>
  </defs>

  <rect width="880" height="190" rx="14" fill="url(#bg)"/>

  <!-- faint contour lines -->
  <g fill="none" stroke="#2c4a6e" stroke-width="1" opacity="0.45">
    <path d="M0 142 C 140 118, 250 165, 400 138 S 700 110, 880 142"/>
    <path d="M0 162 C 160 140, 280 182, 430 158 S 720 132, 880 160"/>
    <path d="M0 40 C 180 64, 300 18, 460 44 S 740 70, 880 36"/>
  </g>

  <!-- path of least resistance: nodes, some killed, one route through -->
  <g>
    <path d="M560 132 L 626 96 L 700 118 L 768 70 L 838 88" fill="none" stroke="url(#path)" stroke-width="2.5" stroke-linecap="round"/>
    <g stroke="#3e5e82" stroke-width="1.5" fill="#0b1220">
      <circle cx="588" cy="58" r="6"/>
      <circle cx="668" cy="46" r="6"/>
      <circle cx="724" cy="152" r="6"/>
      <circle cx="804" cy="132" r="6"/>
    </g>
    <g fill="#7fd1a8" stroke="#0b1220" stroke-width="1.5">
      <circle cx="560" cy="132" r="7"/>
      <circle cx="626" cy="96" r="7"/>
      <circle cx="700" cy="118" r="7"/>
      <circle cx="768" cy="70" r="7"/>
      <circle cx="838" cy="88" r="8"/>
    </g>
    <!-- kill marks on eliminated nodes -->
    <g stroke="#c4677a" stroke-width="2" stroke-linecap="round" opacity="0.9">
      <path d="M583 53 l 10 10 M593 53 l -10 10"/>
      <path d="M663 41 l 10 10 M673 41 l -10 10"/>
      <path d="M719 147 l 10 10 M729 147 l -10 10"/>
      <path d="M799 127 l 10 10 M809 127 l -10 10"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="48" y="88" font-size="44" font-weight="700" letter-spacing="10" fill="#f3f6fa">GEODESIC</text>
    <text x="50" y="122" font-size="16" fill="#9fb6cd">Where can a new city get a durable yes?</text>
    <text x="50" y="150" font-size="12.5" letter-spacing="1" fill="#5e7da0">AN ELIMINATION ENGINE FOR ENTITLEMENT FEASIBILITY</text>
  </g>
</svg>
